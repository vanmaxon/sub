<svg viewBox="0 0 800 365" width="800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">subconverter conversion flow</title>
  <desc id="desc">An animated flow in which subscriptions enter the HTTP API, are parsed and converted with runtime templates, then are emitted as client configurations.</desc>
  <style>
    text { font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
    .title { fill: #1e293b; font-size: 16px; font-weight: 700; }
    .body { fill: #1e293b; font-size: 12px; font-weight: 600; }
    .detail { fill: #64748b; font-size: 10px; }
    .line { fill: none; stroke: #64748b; stroke-width: 1.5; }
    .flow { stroke-dasharray: 6 5; animation: flow 1.2s linear infinite; }
    .processing-box { transform-box: fill-box; transform-origin: center; animation: process 2.4s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @keyframes process { 0%, 100% { opacity: 1; } 50% { opacity: 0.72; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .processing-box { animation: none; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#64748b"/>
    </marker>
  </defs>

  <text class="title" x="400" y="32" text-anchor="middle">subconverter · conversion flow</text>
  <text class="detail" x="400" y="52" text-anchor="middle">Code-confirmed runtime path</text>

  <!-- Connectors: source right edges 175, 355, 555; target left edges 205, 385, 585. -->
  <path class="line flow" d="M180,156 L194,156" marker-end="url(#arrow)"/>
  <path class="line flow" d="M360,156 L374,156" marker-end="url(#arrow)"/>
  <path class="line flow" d="M560,156 L574,156" marker-end="url(#arrow)"/>
  <!-- Runtime data top edge 260; processor bottom edge 192. -->
  <path class="line flow" d="M470,255 L470,203" marker-end="url(#arrow)"/>

  <!-- Input: x=25, y=120, width=150, height=72 -->
  <rect x="25" y="120" width="150" height="72" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text class="body" x="100" y="147" text-anchor="middle">Subscriptions</text>
  <text class="detail" x="100" y="166" text-anchor="middle">URLs · Base64 · node links</text>

  <!-- HTTP service: x=205, y=120, width=150, height=72 -->
  <rect x="205" y="120" width="150" height="72" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="body" x="280" y="147" text-anchor="middle">HTTP service</text>
  <text class="detail" x="280" y="166" text-anchor="middle">/sub · /version</text>

  <!-- Processor: x=385, y=120, width=170, height=72 -->
  <rect class="processing-box" x="385" y="120" width="170" height="72" rx="8" fill="#f3e8ff" stroke="#a855f7"/>
  <text class="body" x="470" y="147" text-anchor="middle">Parse &amp; convert</text>
  <text class="detail" x="470" y="166" text-anchor="middle">filters · rules · templates</text>

  <!-- Output: x=585, y=120, width=190, height=72 -->
  <rect x="585" y="120" width="190" height="72" rx="8" fill="#d1fae5" stroke="#22c55e"/>
  <text class="body" x="680" y="147" text-anchor="middle">Client configurations</text>
  <text class="detail" x="680" y="166" text-anchor="middle">Clash · Surge · QuanX · sing-box</text>

  <!-- Runtime data: x=330, y=260, width=280, height=54 -->
  <rect x="330" y="260" width="280" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="6,4"/>
  <text class="body" x="470" y="283" text-anchor="middle">Runtime data</text>
  <text class="detail" x="470" y="301" text-anchor="middle">base/ · profiles/ · pref.* · rulesets</text>

  <text class="detail" x="400" y="340" text-anchor="middle">Configuration and templates shape generated output without changing the conversion API.</text>
</svg>

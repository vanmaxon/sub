name: Build x86 Docker Image

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'base/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'scripts/Dockerfile.github'
      - '.dockerignore'
      - '.github/workflows/docker-x86-manual.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag for ghcr.io/vanmaxon/subconverter
        required: true
        default: manual
        type: string
      push:
        description: Push the built image to GHCR
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-x86-manual-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/vanmaxon/subconverter
  CACHE_SCOPE: subconverter-linux-amd64

jobs:
  build:
    name: Build linux/amd64 image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image revision
        id: revision
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile.github
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' || inputs.push }}
          build-args: |
            SHA=${{ steps.revision.outputs.sha_short }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.revision.outputs.tag }}
            ${{ env.IMAGE_NAME }}:sha-${{ steps.revision.outputs.sha_short }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_SCOPE }}
